<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Order Book</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: monospace;
    font-size: 13px;
    background: #fff;
    color: #111;

    margin: 0;
    min-height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

table {
    width: 320px;
    border-collapse: collapse;
    table-layout: fixed;
}

col.c-price { width: 160px; }
col.c-qty { width: 160px; }

td, th {
    padding: 3px 8px;
    font-variant-numeric: tabular-nums;
}

th {
    font-size: 10px;
    color: #bbb;
    font-weight: normal;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding-bottom: 6px;
    border-bottom: 1px solid #eee;
    text-align: left;
}

th:last-child { text-align: right; }
td:last-child { text-align: right; }

.ask { color: #dc2626; }
.bid { color: #16a34a; }

.spread-row {
    padding: 6px 8px;
    font-size: 11px;
    color: #999;
    width: 320px;
    border-top: 1px solid #eee;
    border-bottom: 1px solid #eee;
    margin: 2px 0;
}

.footer {
    font-size: 11px;
    color: #ccc;
    margin-top: 12px;
    text-align: center;
    width: 320px;
    display: flex;
    flex-direction: column;
    gap: 2px;
}
</style>
</head>
<body>

<table>
    <colgroup>
        <col class="c-price">
        <col class="c-qty">
    </colgroup>
    <thead>
        <tr>
            <th>Price</th>
            <th>Qty</th>
        </tr>
    </thead>
    <tbody id="ask-body"></tbody>
</table>

<div class="spread-row">
    spread <span id="spread-val">—</span>
</div>

<table>
    <colgroup>
        <col class="c-price">
        <col class="c-qty">
    </colgroup>
    <tbody id="bid-body"></tbody>
</table>

<div class="footer">
    <span id="total-orders-display"></span>
    <span id="ts"></span>
</div>

<script>
const POLL_MS = 500;

function fmtP(p) {
    return '$' + (p / 100).toFixed(2);
}

function fmt(n) {
    return n.toLocaleString();
}

async function fetchSnapshot() {
    try {
        const res = await fetch('snapshot.json?t=' + Date.now());
        if (!res.ok) throw new Error();

        const data = await res.json();
        render(data);

        document.getElementById('ts').textContent =
            'updated ' + new Date().toLocaleTimeString();
    } catch (e) {
        document.getElementById('ts').textContent =
            'waiting for engine...';
    }
}

function render(data) {
    const bids = data.bids || [];
    const asks = data.asks || [];

    const bestBid = bids[0]?.price ?? 0;
    const bestAsk = asks[0]?.price ?? 0;

    const spread = bestAsk && bestBid
        ? bestAsk - bestBid
        : 0;

    document.getElementById('spread-val').textContent =
        spread ? fmtP(spread) : '—';

    document.getElementById('total-orders-display').textContent =
        data.totalOrders != null ? fmt(data.totalOrders) + ' orders processed' : '';

    const asksRev = [...asks].reverse();

    document.getElementById('ask-body').innerHTML =
        asksRev.map(a => `
            <tr>
                <td class="ask">${fmtP(a.price)}</td>
                <td class="ask">${fmt(a.qty)}</td>
            </tr>
        `).join('');

    document.getElementById('bid-body').innerHTML =
        bids.map(b => `
            <tr>
                <td class="bid">${fmtP(b.price)}</td>
                <td class="bid">${fmt(b.qty)}</td>
            </tr>
        `).join('');
}

fetchSnapshot();
setInterval(fetchSnapshot, POLL_MS);
</script>

</body>
</html>
